# Vertex reverse proxy and frontend static serving (optional profile: with-frontend).
server {
    listen 80;

    # ui/Dockerfile copies the version-matched frontend build here.
    root /vertex/ui;
    index index.html;
    client_max_body_size 65m;
    # Filled from the container's resolver by the official nginx entrypoint.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=5s ipv6=off;
    set $vertex_api server:8080;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到 server 服务
    location /api/ {
        proxy_pass http://$vertex_api;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
