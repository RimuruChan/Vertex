name: vertex

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vertex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vertex-dev-password}
      POSTGRES_DB: vertex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vertex"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://vertex:${POSTGRES_PASSWORD:-vertex-dev-password}@postgres:5432/vertex
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-vertex-dev-jwt-secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      PORT: "8080"
      TESTDATA_ROOT: /testdata
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - testdata:/testdata
  judge:
    build:
      context: .
      dockerfile: judge/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://vertex:${POSTGRES_PASSWORD:-vertex-dev-password}@postgres:5432/vertex
      JUDGE_WORKERS: "2"
      TESTDATA_ROOT: /testdata
      SCRATCH_ROOT: /scratch
      CACHE_ROOT: /cache
      ISOLATE_BASE: /var/local/lib/isolate
    volumes:
      - testdata:/testdata:ro   # judge 只读测试数据
      - scratch:/scratch
      - cache:/cache
      - isolatebox:/var/local/lib/isolate
      # isolate --cg 需要写 cgroupfs 以设置内存限制
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    # isolate 需要看到宿主 cgroup v2 层级;用户代码仍运行在独立 cgroup/netns 中。
    cgroup: host
    # === 沙箱加固(sandbox checklist)===
    # 非特权容器:不设 privileged、保留 Docker 默认 seccomp、只读 rootfs。
    # 目标代码断网由 isolate 的独立 netns 保证(--run 默认不 share-net),
    # worker 自身仍需网络以连接 Postgres。
    # CAP_SYS_ADMIN 仅用于 isolate 创建 mount namespace;逃逸后果=容器内 root,非宿主机 root。
    cap_add:
      - SYS_ADMIN
    read_only: true
    tmpfs:
      - /tmp:size=256m

  nginx:
    image: nginx:alpine
    depends_on:
      - web
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    profiles: ["with-frontend"]  # 前端构建后启用(可选)

volumes:
  pgdata:
  testdata:
  scratch:
  cache:
  isolatebox:
