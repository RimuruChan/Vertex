name: vertex

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vertex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vertex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vertex"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://vertex:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/vertex
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      AUTH_ACCESS_TTL: ${AUTH_ACCESS_TTL:-15m}
      AUTH_REFRESH_TTL: ${AUTH_REFRESH_TTL:-720h}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
      RATE_LIMIT_MAX_KEYS: ${RATE_LIMIT_MAX_KEYS:-10000}
      AUTH_LOGIN_RATE_LIMIT: ${AUTH_LOGIN_RATE_LIMIT:-10}
      AUTH_LOGIN_CLIENT_RATE_LIMIT: ${AUTH_LOGIN_CLIENT_RATE_LIMIT:-120}
      AUTH_REGISTER_RATE_LIMIT: ${AUTH_REGISTER_RATE_LIMIT:-20}
      CONTEST_REGISTER_RATE_LIMIT: ${CONTEST_REGISTER_RATE_LIMIT:-10}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-}
      JUDGE_API_TOKEN: ${JUDGE_API_TOKEN:?set JUDGE_API_TOKEN in .env}
      JUDGE_LONG_POLL_TIMEOUT: ${JUDGE_LONG_POLL_TIMEOUT:-25s}
      JUDGE_LEASE_TTL: ${JUDGE_LEASE_TTL:-45s}
      BUILD_LEASE_TTL: ${BUILD_LEASE_TTL:-120s}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@vertex.local}
      PORT: "8080"
      TESTDATA_ROOT: /vertex/testdata
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - testdata:/vertex/testdata
    healthcheck:
      test: ["CMD", "/vertex/vertex-server", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    environment:
      JUDGE_API_URL: http://server:8080/internal/judge/v1
      JUDGE_API_TOKEN: ${JUDGE_API_TOKEN:?set JUDGE_API_TOKEN in .env}
      JUDGE_WORKER_ID: ${JUDGE_WORKER_ID:-}
      JUDGE_LONG_POLL_TIMEOUT: ${JUDGE_LONG_POLL_TIMEOUT:-25s}
      JUDGE_HTTP_TIMEOUT: ${JUDGE_HTTP_TIMEOUT:-40s}
      JUDGE_WORKERS: ${JUDGE_WORKERS:-2}
      BUILD_WORKER_ENABLED: ${BUILD_WORKER_ENABLED:-true}
      BUILD_PROGRESS_INTERVAL: ${BUILD_PROGRESS_INTERVAL:-15s}
      TESTLIB_PATH: /vertex/testlib.h
      VERTEX_ROOT: /vertex
      SANDBOX_TIME_OVERSHOOT_MS: ${SANDBOX_TIME_OVERSHOOT_MS:-1000}
      SANDBOX_WORKSPACE_BYTES: ${SANDBOX_WORKSPACE_BYTES:-67108864}
      SANDBOX_WORKSPACE_INODES: ${SANDBOX_WORKSPACE_INODES:-4096}
      SANDBOX_CPUSET: ${SANDBOX_CPUSET:-}
    volumes:
      - testdata:/vertex/testdata:ro
      - scratch:/vertex/scratch
      - cache:/vertex/cache
    # The native sandbox prepares task cgroups inside this container's hierarchy.
    # Privilege is needed only by the trusted supervisor; submitted programs
    # still drop credentials/capabilities and enforce Landlock + seccomp.
    privileged: true
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /vertex/run:size=16m
      - /vertex/sandbox:exec,nosuid,nodev,size=512m

  nginx:
    build:
      context: .
      dockerfile: ui/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-80}:80"
    profiles: ["with-frontend"]

volumes:
  pgdata:
  testdata:
  scratch:
  cache:
