info:
  contact: {}
  description: Public application endpoints and the authenticated Judge worker protocol.
  title: Vertex OJ API
  version: "1.0"
paths:
  /api/admin/announcements:
    get:
      parameters:
      - description: Filter by currently active pin, including its deadline
        in: query
        name: pinned
        type: boolean
      - description: Page
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: size
        type: integer
      - description: Title or public number
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.ListResponse-dto_AnnouncementResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List domain announcements including drafts
      tags:
      - announcements
    post:
      consumes:
      - application/json
      parameters:
      - description: Announcement
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AnnouncementUpsertRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AnnouncementResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a domain announcement
      tags:
      - admin
  /api/admin/announcements/{id}:
    delete:
      parameters:
      - description: Announcement ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
