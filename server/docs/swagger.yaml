        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Register
      tags:
      - auth
  /api/domain-permissions:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.ListResponse-dto_PermissionResponse'
      summary: List the domain permission catalogue
      tags:
      - domains
  /api/domains:
    get:
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: size
        type: integer
      - description: Name or slug
        in: query
        name: keyword
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.ListResponse-dto_DomainResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: List domains
      tags:
      - domains
    post:
      consumes:
      - application/json
      parameters:
      - description: Domain
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateDomainRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.DomainResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a domain
      tags:
      - domains
  /api/domains/{domain}:
    get:
      parameters:
      - description: Domain slug
        in: path
        name: domain
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DomainResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Read a domain and effective capabilities
      tags:
      - domains
    put:
      consumes:
      - application/json
      parameters:
      - description: Domain slug
        in: path
        name: domain
        required: true
        type: string
      - description: Settings
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateDomainRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DomainResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
