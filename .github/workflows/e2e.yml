# Vertex OJ 端到端测试。
# CI 与生产使用同一条启动路径:构建 Compose 镜像,启动完整服务,再从宿主运行 API E2E。

name: e2e

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            web/go.sum
            judge/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Go checks
        run: |
          go -C web vet ./...
          go -C web test ./...
          go -C judge vet ./...
          go -C judge test ./...

      - name: Frontend build
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Build and start Docker stack
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Wait for API
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:8080/api/health && exit 0
            sleep 1
          done
          exit 1

      - name: Run E2E
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_USER: admin
          E2E_ADMIN_PASS: admin123
        run: go test ./e2e/ -v -timeout 20m

      - name: Collect Docker diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v --remove-orphans
