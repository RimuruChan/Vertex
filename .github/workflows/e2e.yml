# Vertex OJ 端到端测试。
# CI 与生产使用同一条启动路径:构建 Compose 镜像,启动完整服务,再从宿主运行 API E2E。

name: e2e

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Public, CI-only credentials. Production values must be configured separately.
      POSTGRES_PASSWORD: ci-only-postgres-password
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      JUDGE_API_TOKEN: ci-only-judge-api-token-with-at-least-32-characters
      ADMIN_PASSWORD: ci-only-admin-password

    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vertex_test
          POSTGRES_PASSWORD: vertex_test
          POSTGRES_DB: vertex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vertex_test -d vertex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: |
            web/go.sum
            judge/go.sum

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Go checks
        env:
          TEST_DATABASE_URL: postgres://vertex_test:vertex_test@127.0.0.1:5432/vertex_test?sslmode=disable
        run: |
          go -C web vet ./...
          go -C web test ./...
          go -C judge vet ./...
          go -C judge test ./...

      - name: Verify generated OpenAPI
        working-directory: web
        run: |
          go generate .
          git diff --exit-code -- docs internal/*/handler internal/transport/httpapi

      - name: Frontend generation and build
        working-directory: webui
        run: |
          pnpm install --frozen-lockfile
          pnpm run api:check
          pnpm run build

      - name: Build and start Docker stack
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Wait for API
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:8080/api/health && exit 0
            sleep 1
          done
          exit 1

      - name: Verify sandbox security boundary
        run: |
          judge_id=$(docker compose ps -q judge)
          test -n "$judge_id"
          test "$(docker inspect "$judge_id" --format '{{.AppArmorProfile}}')" = "docker-default"
          test "$(docker inspect "$judge_id" --format '{{.HostConfig.Privileged}}')" = "false"
          test "$(docker inspect "$judge_id" --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
          test "$(docker inspect "$judge_id" --format '{{.HostConfig.CgroupnsMode}}')" = "host"
          test "$(docker inspect "$judge_id" --format '{{json .HostConfig.CapAdd}}')" = '["CAP_CHOWN","CAP_DAC_OVERRIDE","CAP_FOWNER","CAP_KILL","CAP_SETGID","CAP_SETUID"]'
          test -z "$(docker compose exec -T judge sh -c 'printf %s "${DATABASE_URL-}"')"
          project_cgroup=$(docker inspect "$judge_id" --format '{{range .Mounts}}{{if eq .Destination "/vertex-cgroup"}}{{.Source}}:{{.RW}}{{end}}{{end}}')
          case "$project_cgroup" in /sys/fs/cgroup/vertex-*:true) ;; *) exit 1 ;; esac
          docker compose exec -T judge /usr/local/libexec/vertex-sandbox-smoke-test

      - name: Run E2E
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_USER: admin
          E2E_ADMIN_PASS: ${{ env.ADMIN_PASSWORD }}
        run: go test ./e2e/ -run 'TestEndToEnd(Core|Contest|AuthLifecycle)$' -v -timeout 20m

      - name: Verify Judge reconnect recovery
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_USER: admin
          E2E_ADMIN_PASS: ${{ env.ADMIN_PASSWORD }}
        run: |
          docker compose stop web
          sleep 2
          docker compose start web
          for i in $(seq 1 40); do
            curl -sf http://localhost:8080/api/health/ready && break
            sleep 1
          done
          curl -sf http://localhost:8080/api/health/ready
          go test ./e2e/ -run '^TestEndToEndJudgeRecovery$' -v -timeout 3m

      - name: Verify Judge lease fencing
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_USER: admin
          E2E_ADMIN_PASS: ${{ env.ADMIN_PASSWORD }}
          E2E_JUDGE_API_TOKEN: ${{ env.JUDGE_API_TOKEN }}
        run: |
          docker compose stop judge
          go test ./e2e/ -run '^TestEndToEndJudgeFencing$' -v -timeout 2m

      - name: Collect Docker diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v --remove-orphans
