# Independent backend, frontend, sandbox and deployed-system checks.
# E2E uses the production Compose stack.

name: e2e

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public, CI-only credentials. Production values must be configured separately.
  POSTGRES_PASSWORD: ci-only-postgres-password
  JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
  JUDGE_API_TOKEN: ci-only-judge-api-token-with-at-least-32-characters
  ADMIN_PASSWORD: ci-only-admin-password

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vertex_test
          POSTGRES_PASSWORD: vertex_test
          POSTGRES_DB: vertex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vertex_test -d vertex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: |
            server/go.sum
            worker/go.sum

      - name: Go checks
        env:
          TEST_DATABASE_URL: postgres://vertex_test:vertex_test@127.0.0.1:5432/vertex_test?sslmode=disable
        run: |
          go -C server vet ./...
          go -C server test ./...
          go -C worker vet ./...
          go -C worker test ./...

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify SQL generation
        env:
          # sqlc is pinned but requires a newer Go than the application.
          GOTOOLCHAIN: auto
        working-directory: server
        run: |
          go generate ./internal/platform/database
          node ../ui/scripts/check-generated-clean.mjs internal

      - name: Verify generated OpenAPI
        working-directory: server
        run: |
          go generate .
          node ../ui/scripts/check-generated-clean.mjs docs cmd/server internal

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Frontend generation and build
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run api:check
          pnpm run format:check
          pnpm run test
          pnpm run build
          pnpm run build:mock

  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum

      - name: Build worker image and integration tests
        run: |
          docker compose build worker
          CGO_ENABLED=0 go -C worker test -c -o /tmp/environment.test ./internal/run

      - name: Verify sandbox environments
        run: |
          docker compose run --rm --no-deps \
            -v /tmp/environment.test:/vertex/environment.test:ro \
            -e VERTEX_SANDBOX_INTEGRATION=1 \
            --entrypoint /vertex/environment.test worker \
            -test.run '^TestEnvironment' -test.v -test.timeout=120s

      - name: Verify native isolation and resource limits
        run: docker compose run --rm --no-deps --entrypoint /vertex/sandbox-smoke-test worker

      - name: Stop sandbox containers
        if: always()
        run: docker compose down -v --remove-orphans

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build and start Docker stack
        run: docker compose --profile with-frontend up -d --build --scale worker=2 --wait --wait-timeout 120

      - name: Verify frontend image and SPA fallback
        run: |
          curl -fsS http://localhost/ -o /tmp/vertex-index.html
          curl -fsS http://localhost/problems/example -o /tmp/vertex-fallback.html
          grep -Fq '<div id="root"></div>' /tmp/vertex-index.html
          cmp /tmp/vertex-index.html /tmp/vertex-fallback.html
          curl -fsS http://localhost/api/health

      - name: Verify worker deployment contract
        run: |
          worker_ids=$(docker compose ps -q worker)
          test "$(printf '%s\n' "$worker_ids" | sed '/^$/d' | wc -l)" -eq 2
          for worker_id in $worker_ids; do
            test "$(docker inspect "$worker_id" --format '{{json .Config.Entrypoint}}')" = '["/vertex/vertex-worker"]'
            test "$(docker inspect "$worker_id" --format '{{.HostConfig.Privileged}}')" = "true"
            test "$(docker inspect "$worker_id" --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
            docker exec "$worker_id" sh -ec 'test -z "${DATABASE_URL-}${VERTEX_CGROUP_ROOT-}${SANDBOX_BOX_ID-}${SANDBOX_INSTANCE_ID-}"'
          done

      - name: Run E2E
        working-directory: server
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_USER: admin
          E2E_ADMIN_PASS: ${{ env.ADMIN_PASSWORD }}
        # New business scenarios are included automatically; these three require
        # deliberate changes to the running stack and run separately below.
        run: go test ./e2e/ -run '^TestEndToEnd' -skip '^TestEndToEnd(JudgeRecovery|JudgeFencing|DomainProtocol)$' -count=1 -v -timeout 20m

      - name: Verify Judge reconnect recovery
        working-directory: server
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_USER: admin
          E2E_ADMIN_PASS: ${{ env.ADMIN_PASSWORD }}
        run: |
          docker compose up -d --no-deps --force-recreate --wait --wait-timeout 120 server
          curl -sf http://localhost:8080/api/health/ready
          # The frontend must rediscover the recreated API container by DNS.
          for i in $(seq 1 30); do
            curl -sf http://localhost/api/health/ready && break
            sleep 1
          done
          curl -sf http://localhost/api/health/ready
          go test ./e2e/ -run '^TestEndToEndJudgeRecovery$' -v -timeout 3m

      - name: Verify Judge lease fencing
        working-directory: server
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_USER: admin
          E2E_ADMIN_PASS: ${{ env.ADMIN_PASSWORD }}
          E2E_JUDGE_API_TOKEN: ${{ env.JUDGE_API_TOKEN }}
        run: |
          docker compose stop worker
          # DomainProtocol creates and consumes its own jobs; run it before the
          # legacy fencing scenario, which deliberately leaves a queued retry.
          go test ./e2e/ -run '^TestEndToEndDomainProtocol$' -v -timeout 3m
          go test ./e2e/ -run '^TestEndToEndJudgeFencing$' -v -timeout 2m

      - name: Collect Docker diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Stop Docker stack
        if: always()
        run: docker compose --profile with-frontend down -v --remove-orphans
