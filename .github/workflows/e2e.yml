# Vertex OJ 端到端测试。
# CI 与生产使用同一条启动路径:构建 Compose 镜像,启动完整服务,再从宿主运行 API E2E。

name: e2e

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Public, CI-only credentials. Production values must be configured separately.
      POSTGRES_PASSWORD: ci-only-postgres-password
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      JUDGE_API_TOKEN: ci-only-judge-api-token-with-at-least-32-characters
      ADMIN_PASSWORD: ci-only-admin-password

    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vertex_test
          POSTGRES_PASSWORD: vertex_test
          POSTGRES_DB: vertex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vertex_test -d vertex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: |
            server/go.sum
            worker/go.sum

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Go checks
        env:
          TEST_DATABASE_URL: postgres://vertex_test:vertex_test@127.0.0.1:5432/vertex_test?sslmode=disable
        run: |
          go -C server vet ./...
          go -C server test ./...
          go -C worker vet ./...
          go -C worker test ./...

      - name: Verify generated OpenAPI
        working-directory: server
        run: |
          go generate .
          node ../ui/scripts/check-generated-clean.mjs docs cmd/server internal

      - name: Frontend generation and build
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run api:check
          pnpm run format:check
          pnpm run test
          pnpm run build
          pnpm run build:mock

      - name: Build and start Docker stack
        run: docker compose --profile with-frontend up -d --build --scale worker=2 --wait --wait-timeout 120

      - name: Wait for API
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:8080/api/health && exit 0
            sleep 1
          done
          exit 1

      - name: Verify frontend image and SPA fallback
        run: |
          curl -fsS http://localhost/ -o /tmp/vertex-index.html
          curl -fsS http://localhost/problems/example -o /tmp/vertex-fallback.html
          grep -Fq '<div id="root"></div>' /tmp/vertex-index.html
          cmp /tmp/vertex-index.html /tmp/vertex-fallback.html
          curl -fsS http://localhost/api/health

      - name: Verify sandbox security boundary
        run: |
          worker_ids=$(docker compose ps -q worker)
          test "$(printf '%s\n' "$worker_ids" | sed '/^$/d' | wc -l)" -eq 2
          : > /tmp/vertex-worker-instances
          : > /tmp/vertex-worker-sandbox-roots
          : > /tmp/vertex-worker-scratch-roots
          : > /tmp/vertex-worker-cgroup-roots
          : > /tmp/vertex-worker-locks
          for worker_id in $worker_ids; do
            test "$(docker inspect "$worker_id" --format '{{.AppArmorProfile}}')" = "docker-default"
            test "$(docker inspect "$worker_id" --format '{{.HostConfig.Privileged}}')" = "false"
            test "$(docker inspect "$worker_id" --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
            test "$(docker inspect "$worker_id" --format '{{.HostConfig.CgroupnsMode}}')" = "host"
            test "$(docker inspect "$worker_id" --format '{{json .HostConfig.CapAdd}}')" = '["CAP_CHOWN","CAP_DAC_OVERRIDE","CAP_FOWNER","CAP_KILL","CAP_SETGID","CAP_SETUID"]'
            project_cgroup=$(docker inspect "$worker_id" --format '{{range .Mounts}}{{if eq .Destination "/vertex-cgroup"}}{{.Source}}:{{.RW}}{{end}}{{end}}')
            case "$project_cgroup" in /sys/fs/cgroup/vertex-*:true) ;; *) exit 1 ;; esac

            metadata=$(docker exec "$worker_id" sh -c '
              read_env() { tr "\000" "\n" < /proc/1/environ | sed -n "s/^$1=//p"; }
              printf "%s|%s|%s|%s|%s|%s|%s" \
                "$(read_env SANDBOX_INSTANCE_ID)" "$(read_env SANDBOX_BASE)" \
                "$(read_env SCRATCH_ROOT)" "$(read_env VERTEX_CGROUP_ROOT)" \
                "$(read_env CACHE_ROOT)" "$(read_env TESTDATA_ROOT)" \
                "$(read_env SANDBOX_INSTANCE_LOCK)"
            ')
            IFS='|' read -r instance_id sandbox_root scratch_root cgroup_root cache_root testdata_root instance_lock <<< "$metadata"
            test -n "$instance_id"
            test "$sandbox_root" = "/var/local/lib/vertex-sandbox/instances/$instance_id"
            test "$scratch_root" = "/scratch/instances/$instance_id"
            test "$cgroup_root" = "/vertex-cgroup/instance-$instance_id"
            test "$cache_root" = "/cache"
            test "$testdata_root" = "/testdata"
            test "$instance_lock" = "/var/local/lib/vertex-sandbox/instances/.locks/$instance_id.lock"
            test -z "$(docker exec "$worker_id" sh -c 'printf %s "${DATABASE_URL-}"')"
            docker exec \
              -e EXPECT_SANDBOX_ROOT="$sandbox_root" \
              -e EXPECT_SCRATCH_ROOT="$scratch_root" \
              -e EXPECT_CGROUP_ROOT="$cgroup_root" \
              "$worker_id" sh -eu -c '
              test -d "$EXPECT_SANDBOX_ROOT"
              test -d "$EXPECT_SCRATCH_ROOT"
              test -f "$EXPECT_CGROUP_ROOT/cgroup.controllers"
              for controller in cpu memory pids; do
                grep -qw "$controller" "$EXPECT_CGROUP_ROOT/cgroup.controllers"
                grep -qw "$controller" "$EXPECT_CGROUP_ROOT/cgroup.subtree_control"
              done
            '
            printf '%s\n' "$instance_id" >> /tmp/vertex-worker-instances
            printf '%s\n' "$sandbox_root" >> /tmp/vertex-worker-sandbox-roots
            printf '%s\n' "$scratch_root" >> /tmp/vertex-worker-scratch-roots
            printf '%s\n' "$cgroup_root" >> /tmp/vertex-worker-cgroup-roots
            printf '%s\n' "$instance_lock" >> /tmp/vertex-worker-locks
          done
          test "$(sort -u /tmp/vertex-worker-instances | wc -l)" -eq 2
          test "$(sort -u /tmp/vertex-worker-sandbox-roots | wc -l)" -eq 2
          test "$(sort -u /tmp/vertex-worker-scratch-roots | wc -l)" -eq 2
          test "$(sort -u /tmp/vertex-worker-cgroup-roots | wc -l)" -eq 2
          test "$(sort -u /tmp/vertex-worker-locks | wc -l)" -eq 2
          first_worker=$(printf '%s\n' "$worker_ids" | sed -n '1p')
          if docker exec "$first_worker" worker-entrypoint vertex-worker; then
            echo "duplicate SANDBOX_INSTANCE_ID unexpectedly acquired its lock" >&2
            exit 1
          fi
          if docker exec -e SANDBOX_INSTANCE_ID='../invalid' "$first_worker" worker-entrypoint true; then
            echo "invalid SANDBOX_INSTANCE_ID unexpectedly passed validation" >&2
            exit 1
          fi
          docker exec "$first_worker" /usr/local/libexec/vertex-sandbox-smoke-test

      - name: Run E2E
        working-directory: server
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_USER: admin
          E2E_ADMIN_PASS: ${{ env.ADMIN_PASSWORD }}
        run: go test ./e2e/ -run 'TestEndToEnd(Core|Contest|ContestICPC|ContestScoreFormats|AuthLifecycle|ProblemAuthoring|ProblemSets|CommunityContent|AdminConsole|DomainWorkflow)$' -v -timeout 20m

      - name: Verify Judge reconnect recovery
        working-directory: server
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_USER: admin
          E2E_ADMIN_PASS: ${{ env.ADMIN_PASSWORD }}
        run: |
          docker compose stop server
          sleep 2
          docker compose start server
          for i in $(seq 1 40); do
            curl -sf http://localhost:8080/api/health/ready && break
            sleep 1
          done
          curl -sf http://localhost:8080/api/health/ready
          go test ./e2e/ -run '^TestEndToEndJudgeRecovery$' -v -timeout 3m

      - name: Verify Judge lease fencing
        working-directory: server
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_USER: admin
          E2E_ADMIN_PASS: ${{ env.ADMIN_PASSWORD }}
          E2E_JUDGE_API_TOKEN: ${{ env.JUDGE_API_TOKEN }}
        run: |
          docker compose stop worker
          # DomainProtocol creates and consumes its own jobs; run it before the
          # legacy fencing scenario, which deliberately leaves a queued retry.
          go test ./e2e/ -run '^TestEndToEndDomainProtocol$' -v -timeout 3m
          go test ./e2e/ -run '^TestEndToEndJudgeFencing$' -v -timeout 2m

      - name: Collect Docker diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Stop Docker stack
        if: always()
        run: docker compose --profile with-frontend down -v --remove-orphans
